<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Kidvana">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Page Not Found | Kidvana</title>
  <link rel="icon" type="image/png" href="assets/logo/kidvana-logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 520px;
    }
    .logo {
      width: 160px;
      margin-bottom: 30px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 800;
      color: #e91e63;
      line-height: 1;
      margin-bottom: 10px;
    }
    .error-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #222;
    }
    .error-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .home-btn {
      display: inline-block;
      padding: 14px 36px;
      background: #e91e63;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .home-btn:hover {
      background: #c2185b;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/">
      <img src="assets/logo/kidvana-logo.png" alt="Kidvana Logo" class="logo">
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Oops! Page Not Found</h1>
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved.<br>
      Let's get you back on track!
    </p>
    <a href="/" class="home-btn">Back to Homepage</a>
  </div>
</body>
</html>
